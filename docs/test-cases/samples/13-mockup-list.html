<h2 class="sr-only">团队成员列表界面原型</h2><style>.vz-list{background:var(--viz-bg-primary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;font-family:var(--viz-font-sans)}.vz-head{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px}.vz-head span{font-size:14px;font-weight:500;color:var(--viz-text-primary)}.vz-add{height:32px;padding:0 12px;border:0.5px solid var(--viz-info);border-radius:var(--viz-radius-sm);background:var(--viz-info);color:#fff;font:13px var(--viz-font-sans)}.vz-row{display:flex;align-items:center;gap:12px;padding:10px 0;border-top:0.5px solid var(--viz-border-subtle)}.vz-avatar{width:32px;height:32px;border-radius:50%;background:var(--viz-blue-100);color:var(--viz-blue-700);display:inline-flex;align-items:center;justify-content:center;font-size:13px;font-weight:500;flex:none}.vz-meta{display:flex;flex-direction:column;min-width:0;flex:1}.vz-name{font-size:13px;color:var(--viz-text-primary)}.vz-mail{font-size:11px;color:var(--viz-text-tertiary)}.vz-badge{font-size:11px;padding:2px 8px;border-radius:999px;background:var(--viz-bg-secondary);color:var(--viz-text-secondary)}</style><div class="vz-list"><div class="vz-head"><span>团队成员</span><button class="vz-add" type="button">邀请</button></div><div class="vz-row"><span class="vz-avatar">A</span><div class="vz-meta"><span class="vz-name">Alice Chen</span><span class="vz-mail">alice@example.com</span></div><span class="vz-badge">Admin</span></div><div class="vz-row"><span class="vz-avatar">B</span><div class="vz-meta"><span class="vz-name">Bob Li</span><span class="vz-mail">bob@example.com</span></div><span class="vz-badge">Member</span></div><div class="vz-row"><span class="vz-avatar">C</span><div class="vz-meta"><span class="vz-name">Carol Wu</span><span class="vz-mail">carol@example.com</span></div><span class="vz-badge">Guest</span></div></div>
