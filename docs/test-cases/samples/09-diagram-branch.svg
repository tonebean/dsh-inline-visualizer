<svg viewBox="0 0 680 270" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>分支流程：缓存命中判断</title><desc>用户请求先判断缓存是否命中，命中和未命中分别走向不同处理。</desc><defs><marker id="a2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"/></marker></defs><rect x="260" y="30" width="160" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><text x="340" y="52" text-anchor="middle" dominant-baseline="central" style="font-size: 13px; font-weight: 500; fill: var(--viz-text-primary)">用户请求</text><rect x="260" y="100" width="160" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-warning); stroke-width: 0.5"/><text x="340" y="122" text-anchor="middle" dominant-baseline="central" style="font-size: 13px; font-weight: 500; fill: var(--viz-text-primary)">缓存命中？</text><rect x="70" y="190" width="160" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-success); stroke-width: 0.5"/><text x="150" y="212" text-anchor="middle" dominant-baseline="central" style="font-size: 13px; font-weight: 500; fill: var(--viz-text-primary)">返回缓存</text><rect x="450" y="190" width="160" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-info); stroke-width: 0.5"/><text x="530" y="212" text-anchor="middle" dominant-baseline="central" style="font-size: 13px; font-weight: 500; fill: var(--viz-text-primary)">查询模型</text><line x1="340" y1="74" x2="340" y2="96" style="fill: none; stroke: currentColor; stroke-width: 1.5; color: var(--viz-text-tertiary)" marker-end="url(#a2)"/><line x1="300" y1="144" x2="160" y2="186" style="fill: none; stroke: currentColor; stroke-width: 1.5; color: var(--viz-text-tertiary)" marker-end="url(#a2)"/><line x1="380" y1="144" x2="520" y2="186" style="fill: none; stroke: currentColor; stroke-width: 1.5; color: var(--viz-text-tertiary)" marker-end="url(#a2)"/><text x="220" y="166" style="font-size: 11px; fill: var(--viz-success)">是</text><text x="468" y="166" style="font-size: 11px; fill: var(--viz-info)">否</text></svg>