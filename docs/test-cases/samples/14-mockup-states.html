<h2 class="sr-only">输入框状态板：默认、聚焦、禁用、错误</h2><style>.vz-states{background:var(--viz-bg-primary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;font-family:var(--viz-font-sans)}.vz-title{font-size:14px;font-weight:500;color:var(--viz-text-primary);margin-bottom:12px}.vz-field{margin-bottom:12px}.vz-label{display:block;font-size:12px;color:var(--viz-text-secondary);margin-bottom:4px}.vz-input{width:100%;height:36px;padding:0 12px;border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-sm);background:var(--viz-bg-primary);color:var(--viz-text-primary);font:13px var(--viz-font-sans);box-sizing:border-box}.vz-focus{border:2px solid var(--viz-info)}.vz-disabled{opacity:0.5}.vz-error{border-color:var(--viz-danger)}.vz-err{display:block;margin-top:4px;font-size:11px;color:var(--viz-danger)}</style><div class="vz-states"><div class="vz-title">输入框状态</div><div class="vz-field"><label class="vz-label">默认</label><input class="vz-input" value="hello@example.com"></div><div class="vz-field"><label class="vz-label">聚焦</label><input class="vz-input vz-focus" value="focused"></div><div class="vz-field"><label class="vz-label">禁用</label><input class="vz-input vz-disabled" value="disabled" disabled></div><div class="vz-field"><label class="vz-label">错误</label><input class="vz-input vz-error" value="" aria-invalid="true"><span class="vz-err">必填项</span></div></div>
