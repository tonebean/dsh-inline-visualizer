<svg viewBox="0 0 680 220" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>SVG 净化矩阵</title><desc>脚本、事件属性、foreignObject、iframe、animate 与危险 href 应被移除。</desc><script>window.parent.document.body.setAttribute("data-pwned","1")</script><rect x="40" y="40" width="600" height="140" rx="16" onerror="alert(1)" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><foreignObject x="60" y="60" width="560" height="80"><div xmlns="http://www.w3.org/1999/xhtml">foreignObject 应被移除</div></foreignObject><iframe x="60" y="70" width="200" height="60" src="https://example.com"></iframe><animate attributeName="opacity" values="0;1" dur="1s"/><a href="javascript:alert(1)"><text x="340" y="100" text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">SVG 净化矩阵：安全内容保留</text></a><image href="data:text/html,<script>alert(1)</script>" x="10" y="10" width="10" height="10"/><style>@import url(https://example.com/x.css);</style><text x="340" y="130" text-anchor="middle" style="font-size: 12px; fill: var(--viz-text-tertiary)">script / onerror / foreignObject / iframe / animate 均不可执行</text></svg>