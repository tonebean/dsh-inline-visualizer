<svg viewBox="0 0 680 134" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>dsh-inline-visualizer 工具调用流程</title><desc>用户提问交给 DSH 宿主，宿主调用 show_widget，卡片在对话内就地渲染。</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M2 1L8 5L2 9" style="fill: none; stroke: currentColor; stroke-width: 1.5; stroke-linecap: round; stroke-linejoin: round"/></marker></defs><g><rect x="50" y="50" width="150" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><text x="125" y="72" text-anchor="middle" dominant-baseline="central" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">用户提问</text></g><g><rect x="265" y="50" width="150" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-info); stroke-width: 0.5"/><text x="340" y="72" text-anchor="middle" dominant-baseline="central" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">DSH 宿主</text></g><g><rect x="480" y="50" width="150" height="44" rx="12" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><text x="555" y="72" text-anchor="middle" dominant-baseline="central" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">内联卡片</text></g><line x1="200" y1="72" x2="261" y2="72" style="fill: none; stroke: currentColor; stroke-width: 1.5; color: var(--viz-text-tertiary)" marker-end="url(#arrow)"/><line x1="415" y1="72" x2="476" y2="72" style="fill: none; stroke: currentColor; stroke-width: 1.5; color: var(--viz-text-tertiary)" marker-end="url(#arrow)"/></svg>