<svg viewBox="0 0 680 180" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>主题令牌检查</title><desc>同一张图在浅色和深色主题下的语义令牌表现。</desc><rect x="40" y="30" width="600" height="120" rx="16" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><text x="60" y="62" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">主题令牌</text><rect x="60" y="86" width="100" height="28" rx="8" style="fill: var(--viz-info)"/><text x="110" y="100" text-anchor="middle" dominant-baseline="central" style="font-size: 12px; fill: #FFFFFF">Info</text><rect x="172" y="86" width="100" height="28" rx="8" style="fill: var(--viz-success)"/><text x="222" y="100" text-anchor="middle" dominant-baseline="central" style="font-size: 12px; fill: #FFFFFF">Success</text><rect x="284" y="86" width="100" height="28" rx="8" style="fill: var(--viz-danger)"/><text x="334" y="100" text-anchor="middle" dominant-baseline="central" style="font-size: 12px; fill: #FFFFFF">Danger</text></svg>