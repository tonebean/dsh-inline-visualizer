<svg viewBox="0 0 680 240" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>温度梯度</title><desc>冷到暖的连续温度梯度条，仅使用一个 linearGradient。</desc><defs><linearGradient id="heat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" style="stop-color: var(--viz-blue-300)"/><stop offset="0.55" style="stop-color: var(--viz-amber-300)"/><stop offset="1" style="stop-color: var(--viz-red-500)"/></linearGradient></defs><rect x="80" y="90" width="520" height="40" rx="8" style="fill: url(#heat)"/><text x="80" y="160" style="font-size: 12px; fill: var(--viz-text-secondary)">冷</text><text x="600" y="160" text-anchor="end" style="font-size: 12px; fill: var(--viz-text-secondary)">热</text></svg>