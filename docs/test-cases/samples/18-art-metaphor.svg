<svg viewBox="0 0 680 330" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>漏斗与三个桶</title><desc>输入从漏斗落入三个桶，用空间隐喻表示分发。</desc><polygon points="200,50 480,50 380,170 300,170" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><text x="340" y="82" text-anchor="middle" style="font-size: 13px; fill: var(--viz-text-primary)">输入</text><circle cx="330" cy="182" r="5" style="fill: var(--viz-blue-500)"/><circle cx="346" cy="196" r="5" style="fill: var(--viz-blue-500)"/><circle cx="362" cy="210" r="5" style="fill: var(--viz-blue-500)"/><rect x="150" y="235" width="100" height="55" rx="8" style="fill: var(--viz-blue-100); stroke: var(--viz-blue-500); stroke-width: 0.5"/><rect x="290" y="235" width="100" height="55" rx="8" style="fill: var(--viz-blue-300); stroke: var(--viz-blue-500); stroke-width: 0.5"/><rect x="430" y="235" width="100" height="55" rx="8" style="fill: var(--viz-blue-500); stroke: var(--viz-blue-500); stroke-width: 0.5"/><text x="200" y="264" text-anchor="middle" style="font-size: 12px; fill: var(--viz-text-primary)">桶 A</text><text x="340" y="264" text-anchor="middle" style="font-size: 12px; fill: var(--viz-text-primary)">桶 B</text><text x="480" y="264" text-anchor="middle" style="font-size: 12px; fill: #FFFFFF">桶 C</text></svg>