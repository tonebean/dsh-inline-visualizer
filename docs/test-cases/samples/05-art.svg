<svg viewBox="0 0 680 340" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>分层抽象：从冷到暖的信息流</title><desc>五层逐渐收窄的层板，颜色由冷蓝过渡到暖琥珀，右侧标注输入、编码、表示、解码、输出。</desc><g><rect x="140" y="50" width="400" height="34" rx="8" style="fill: var(--viz-blue-100)"/><text x="580" y="67" dominant-baseline="central" style="font-size: 13px; fill: var(--viz-text-secondary)">输入</text><line x1="548" y1="67" x2="572" y2="67" style="fill: none; stroke: var(--viz-border-strong); stroke-width: 0.5; stroke-dasharray: 3 3"/></g><g><rect x="155" y="102" width="370" height="34" rx="8" style="fill: var(--viz-blue-300)"/><text x="580" y="119" dominant-baseline="central" style="font-size: 13px; fill: var(--viz-text-secondary)">编码</text><line x1="533" y1="119" x2="572" y2="119" style="fill: none; stroke: var(--viz-border-strong); stroke-width: 0.5; stroke-dasharray: 3 3"/></g><g><rect x="170" y="154" width="340" height="34" rx="8" style="fill: var(--viz-blue-500)"/><text x="580" y="171" dominant-baseline="central" style="font-size: 13px; fill: var(--viz-text-secondary)">表示</text><line x1="518" y1="171" x2="572" y2="171" style="fill: none; stroke: var(--viz-border-strong); stroke-width: 0.5; stroke-dasharray: 3 3"/></g><g><rect x="185" y="206" width="310" height="34" rx="8" style="fill: var(--viz-amber-300)"/><text x="580" y="223" dominant-baseline="central" style="font-size: 13px; fill: var(--viz-text-secondary)">解码</text><line x1="503" y1="223" x2="572" y2="223" style="fill: none; stroke: var(--viz-border-strong); stroke-width: 0.5; stroke-dasharray: 3 3"/></g><g><rect x="200" y="258" width="280" height="34" rx="8" style="fill: var(--viz-amber-500)"/><text x="580" y="275" dominant-baseline="central" style="font-size: 13px; fill: var(--viz-text-secondary)">输出</text><line x1="488" y1="275" x2="572" y2="275" style="fill: none; stroke: var(--viz-border-strong); stroke-width: 0.5; stroke-dasharray: 3 3"/></g></svg>