<h2 class="sr-only">通知设置界面原型，包含邮箱、频率、Webhook、桌面通知开关与保存操作</h2><style>.vz-mock{background:var(--viz-bg-primary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;box-sizing:border-box;width:100%;font-family:var(--viz-font-sans);color:var(--viz-text-primary)}.vz-mock-title{margin:0;font-size:14px;font-weight:500}.vz-mock-desc{margin:4px 0 16px;font-size:12px;color:var(--viz-text-secondary)}.vz-field{margin-bottom:12px}.vz-label{display:block;margin-bottom:4px;font-size:12px;color:var(--viz-text-secondary)}.vz-input{display:block;width:100%;height:36px;padding:0 12px;box-sizing:border-box;border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-sm);background:var(--viz-bg-primary);color:var(--viz-text-primary);font:13px var(--viz-font-sans)}.vz-input::placeholder{color:var(--viz-text-tertiary)}.vz-input:focus-visible{outline:2px solid var(--viz-info);outline-offset:1px}.vz-error-input{border-color:var(--viz-danger)}.vz-error-msg{margin:4px 0 0;font-size:12px;color:var(--viz-danger)}.vz-row{display:flex;align-items:center;justify-content:space-between;margin:16px 0;font-size:13px}.vz-switch{position:relative;display:inline-block;width:36px;height:20px}.vz-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.vz-track{display:block;width:36px;height:20px;border-radius:999px;background:var(--viz-border-default);transition:background .15s ease}.vz-track::after{content:"";display:block;width:16px;height:16px;margin:2px;border-radius:50%;background:var(--viz-bg-primary);transition:transform .15s ease}.vz-switch input:checked + .vz-track{background:var(--viz-info)}.vz-switch input:checked + .vz-track::after{transform:translateX(16px)}.vz-switch input:focus-visible + .vz-track{outline:2px solid var(--viz-info);outline-offset:2px}.vz-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:16px}.vz-btn{height:36px;padding:0 16px;border-radius:var(--viz-radius-sm);font:13px var(--viz-font-sans);cursor:pointer}.vz-btn-secondary{background:transparent;border:0.5px solid var(--viz-border-default);color:var(--viz-text-primary)}.vz-btn-primary{background:var(--viz-info);border:0.5px solid var(--viz-info);color:#FFFFFF}.vz-btn:focus-visible{outline:2px solid var(--viz-info);outline-offset:1px}</style><div class="vz-mock"><p class="vz-mock-title">通知设置</p><p class="vz-mock-desc">选择接收通知的方式与频率</p><div class="vz-field"><label class="vz-label" for="vz-email">邮箱</label><input id="vz-email" class="vz-input" type="email" placeholder="you@example.com" value="you@example.com"></div><div class="vz-field"><label class="vz-label" for="vz-freq">通知频率</label><select id="vz-freq" class="vz-input"><option>每天</option><option>每周</option><option>每月</option></select></div><div class="vz-field"><label class="vz-label" for="vz-hook">Webhook</label><input id="vz-hook" class="vz-input vz-error-input" type="text" value="https://" aria-invalid="true"><p class="vz-error-msg">请输入完整的 URL</p></div><div class="vz-row"><span>桌面通知</span><label class="vz-switch"><input type="checkbox" checked aria-label="桌面通知"><span class="vz-track"></span></label></div><div class="vz-actions"><button class="vz-btn vz-btn-secondary" type="button">取消</button><button class="vz-btn vz-btn-primary" type="button">保存</button></div></div>
