<h2 class="sr-only">三步安装向导</h2><style>.vz-steps{display:flex;align-items:center;gap:8px;font-family:var(--viz-font-sans);margin-bottom:12px}.vz-step{display:flex;align-items:center;gap:6px;font-size:12px;color:var(--viz-text-tertiary)}.vz-dot{width:24px;height:24px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;background:var(--viz-bg-secondary);border:0.5px solid var(--viz-border-default);font-size:11px}.vz-step.active{color:var(--viz-text-primary)}.vz-step.active .vz-dot{background:var(--viz-info);color:#fff;border-color:var(--viz-info)}.vz-line{width:40px;height:1px;background:var(--viz-border-default)}.vz-pane{background:var(--viz-bg-secondary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;font-size:13px;color:var(--viz-text-primary);min-height:52px}.vz-actions{display:flex;justify-content:flex-end;gap:8px;margin-top:12px}.vz-btn{height:32px;padding:0 12px;border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-sm);background:var(--viz-bg-primary);color:var(--viz-text-primary);font:13px var(--viz-font-sans);cursor:pointer}.vz-btn.primary{background:var(--viz-info);border-color:var(--viz-info);color:#fff}</style><div class="vz-steps"><div class="vz-step active" data-s="1"><span class="vz-dot">1</span><span>选择</span></div><div class="vz-line"></div><div class="vz-step" data-s="2"><span class="vz-dot">2</span><span>配置</span></div><div class="vz-line"></div><div class="vz-step" data-s="3"><span class="vz-dot">3</span><span>完成</span></div></div><div class="vz-pane" id="vz-pane">第 1 步：选择模板</div><div class="vz-actions"><button class="vz-btn" id="vz-prev" type="button">上一步</button><button class="vz-btn primary" id="vz-next" type="button">下一步</button></div><script>(function(){var step=1;var pane=document.getElementById("vz-pane");var steps=[].slice.call(document.querySelectorAll(".vz-step"));var texts={1:"第 1 步：选择模板",2:"第 2 步：填写配置",3:"第 3 步：完成"};function render(){steps.forEach(function(s){s.classList.toggle("active",Number(s.getAttribute("data-s"))===step)});pane.textContent=texts[step]}document.getElementById("vz-prev").addEventListener("click",function(){step=Math.max(1,step-1);render()});document.getElementById("vz-next").addEventListener("click",function(){step=Math.min(3,step+1);render()});})();</script>
