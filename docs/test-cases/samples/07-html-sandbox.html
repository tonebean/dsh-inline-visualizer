<h2 class="sr-only">沙箱隔离检查：验证宿主 DOM、localStorage 与网络请求均不可用</h2><style>.vz-sec{background:var(--viz-bg-primary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;box-sizing:border-box;width:100%;font-family:var(--viz-font-sans)}.vz-sec-title{margin:0 0 12px;font-size:14px;font-weight:500;color:var(--viz-text-primary)}.vz-sec-list{list-style:none;margin:0;padding:0;font-size:13px;line-height:1.6;color:var(--viz-text-secondary)}.vz-sec-list li{display:flex;align-items:center;gap:8px;margin:4px 0}.vz-dot{width:8px;height:8px;border-radius:50%;background:var(--viz-success);flex:none}</style><div class="vz-sec"><p class="vz-sec-title">沙箱隔离检查</p><ul class="vz-sec-list"><li><span class="vz-dot"></span><span id="vz-host">宿主 DOM 访问：检测中</span></li><li><span class="vz-dot"></span><span id="vz-store">localStorage：检测中</span></li><li><span class="vz-dot"></span><span id="vz-net">网络请求：检测中</span></li></ul></div><script>(function(){var h=document.getElementById("vz-host"),s=document.getElementById("vz-store"),n=document.getElementById("vz-net");try{void parent.document.title;h.textContent="宿主 DOM 访问：未拦截（异常）"}catch(e){h.textContent="宿主 DOM 访问：已拦截"}try{localStorage.setItem("vz","1");s.textContent="localStorage：可用（异常）"}catch(e){s.textContent="localStorage：不可用"}fetch("https://example.com").then(function(){n.textContent="网络请求：未被 CSP 拦截（异常）"}).catch(function(){n.textContent="网络请求：已被 CSP 拦截"})})();</script>
