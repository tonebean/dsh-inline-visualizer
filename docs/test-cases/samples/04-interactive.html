<h2 class="sr-only">交互计数器：用减号和加号按钮调整数值</h2><style>.dsh-viz-card{background:var(--viz-bg-secondary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-lg);padding:16px;box-sizing:border-box;width:100%;font-family:var(--viz-font-sans)}.dsh-viz-btn{width:32px;height:32px;border-radius:var(--viz-radius-sm);border:0.5px solid var(--viz-border-default);background:var(--viz-bg-primary);color:var(--viz-text-primary);font-size:16px;line-height:1;cursor:pointer;display:inline-flex;align-items:center;justify-content:center}.dsh-viz-btn:hover{background:var(--viz-bg-tertiary)}.dsh-viz-btn:focus-visible{outline:2px solid var(--viz-info);outline-offset:1px}@media (prefers-reduced-motion: no-preference){.dsh-viz-btn{transition:transform .15s ease, opacity .15s ease}.dsh-viz-btn:active{transform:scale(.96)}}.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}</style><div class="dsh-viz-card"><div style="font-size:14px;font-weight:500;color:var(--viz-text-primary)">交互计数器</div><div style="margin-top:12px;display:flex;align-items:center;gap:12px"><button id="dsh-viz-dec" class="dsh-viz-btn" type="button" aria-label="减一">−</button><div id="dsh-viz-val" aria-live="polite" style="min-width:48px;text-align:center;font-size:24px;font-weight:500;color:var(--viz-text-primary);font-variant-numeric:tabular-nums">0</div><button id="dsh-viz-inc" class="dsh-viz-btn" type="button" aria-label="加一">+</button></div><p style="margin:8px 0 0;font-size:12px;color:var(--viz-text-tertiary)">点击按钮调整数值</p></div><script>(function(){var v=0;var out=document.getElementById("dsh-viz-val");function render(){out.textContent=String(v)}document.getElementById("dsh-viz-dec").addEventListener("click",function(){v=Math.max(0,v-1);render()});document.getElementById("dsh-viz-inc").addEventListener("click",function(){v=Math.min(99,v+1);render()});})();</script>
