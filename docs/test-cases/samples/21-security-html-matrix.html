<h2 class="sr-only">HTML 沙箱安全矩阵</h2><style>.vz-sec{background:var(--viz-bg-primary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-md);padding:16px;font-family:var(--viz-font-sans)}.vz-t{font-size:14px;font-weight:500;color:var(--viz-text-primary);margin-bottom:10px}.vz-l{display:block;font-size:12px;color:var(--viz-text-secondary);margin:6px 0}</style><div class="vz-sec"><div class="vz-t">沙箱安全矩阵</div><span class="vz-l" id="vz-a">parent.document：检测中</span><span class="vz-l" id="vz-b">localStorage：检测中</span><span class="vz-l" id="vz-c">fetch：检测中</span><span class="vz-l" id="vz-d">window.open：检测中</span></div><script>(function(){var a=document.getElementById("vz-a"),b=document.getElementById("vz-b"),c=document.getElementById("vz-c"),d=document.getElementById("vz-d");try{void parent.document.title;a.textContent="parent.document：已拦截"}catch(e){a.textContent="parent.document：已拦截"}try{localStorage.setItem("x","1");b.textContent="localStorage：可用（异常）"}catch(e){b.textContent="localStorage：不可用"}fetch("https://example.com").then(function(){c.textContent="fetch：未拦截（异常）"}).catch(function(){c.textContent="fetch：已拦截"});try{var w=window.open("https://example.com");d.textContent=w?"window.open：未拦截（异常）":"window.open：已拦截"}catch(e){d.textContent="window.open：已拦截"}})();</script>
