<svg viewBox="0 0 680 220" width="100%" role="img" xmlns="http://www.w3.org/2000/svg" style="font-family: var(--viz-font-sans)"><title>SVG 净化测试</title><desc>脚本、事件属性与 foreignObject 应被移除，只保留安全图形与文字。</desc><script>window.parent.document.body.setAttribute("data-pwned","1")</script><rect x="40" y="50" width="600" height="120" rx="16" onload="alert(1)" style="fill: var(--viz-bg-secondary); stroke: var(--viz-border-default); stroke-width: 0.5"/><foreignObject x="60" y="70" width="560" height="80"><div xmlns="http://www.w3.org/1999/xhtml">foreignObject 内容应被移除</div></foreignObject><text x="340" y="102" text-anchor="middle" style="font-size: 14px; font-weight: 500; fill: var(--viz-text-primary)">净化测试：只应保留这个安全图形</text><text x="340" y="130" text-anchor="middle" style="font-size: 12px; fill: var(--viz-text-tertiary)">script / onload / foreignObject 均不可执行</text></svg>