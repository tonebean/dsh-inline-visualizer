<h2 class="sr-only">通知偏好开关面板</h2><style>.vz-panel{background:var(--viz-bg-secondary);border:0.5px solid var(--viz-border-default);border-radius:var(--viz-radius-lg);padding:16px;font-family:var(--viz-font-sans)}.vz-pt{font-size:14px;font-weight:500;color:var(--viz-text-primary);margin-bottom:12px}.vz-row{display:flex;align-items:center;justify-content:space-between;margin:10px 0;font-size:13px;color:var(--viz-text-primary)}.vz-switch{position:relative;display:inline-block;width:36px;height:20px}.vz-switch input{position:absolute;opacity:0;width:100%;height:100%;margin:0;cursor:pointer}.vz-track{display:block;width:36px;height:20px;border-radius:999px;background:var(--viz-border-default);transition:background .15s ease}.vz-track::after{content:"";display:block;width:16px;height:16px;margin:2px;border-radius:50%;background:var(--viz-bg-primary);transition:transform .15s ease}.vz-switch input:checked + .vz-track{background:var(--viz-info)}.vz-switch input:checked + .vz-track::after{transform:translateX(16px)}.vz-sum{margin-top:12px;font-size:12px;color:var(--viz-text-tertiary)}</style><div class="vz-panel"><div class="vz-pt">通知偏好</div><div class="vz-row"><span>桌面通知</span><label class="vz-switch"><input type="checkbox" checked data-k="a"><span class="vz-track"></span></label></div><div class="vz-row"><span>邮件摘要</span><label class="vz-switch"><input type="checkbox" data-k="b"><span class="vz-track"></span></label></div><div class="vz-row"><span>声音提醒</span><label class="vz-switch"><input type="checkbox" checked data-k="c"><span class="vz-track"></span></label></div><div class="vz-sum" id="vz-sum">已开启 2 项</div></div><script>(function(){var boxes=[].slice.call(document.querySelectorAll("input[data-k]"));var out=document.getElementById("vz-sum");function render(){var n=boxes.filter(function(b){return b.checked}).length;out.textContent="已开启 "+n+" 项"}boxes.forEach(function(b){b.addEventListener("change",render)});})();</script>
